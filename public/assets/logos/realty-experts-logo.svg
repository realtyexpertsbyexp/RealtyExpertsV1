<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <!-- Realty Experts Official Brand Mark -->
  <g id="emblem" transform="translate(10, 10)">
    <!-- Left R-facet (Charcoal #202020) -->
    <!-- Outer isometric block facet forming stylized R -->
    <path d="M 52 0 L 0 30 L 0 85 L 20 73 L 20 40 L 40 28 L 40 45 L 20 57 L 20 73 L 52 100 L 52 75 L 34 59 L 52 47 Z" fill="#202020" />
    <path d="M 0 30 L 22 17 L 52 0 L 52 35 L 22 52 L 0 65 Z" fill="#141414" opacity="0.1" />
    <path d="M 0 30 L 52 0 L 52 34 L 34 44 L 20 36 L 20 50 L 0 62 Z" fill="#202020" />
    
    <!-- Clean geometric 'R' face matching brandmark -->
    <!-- Clean isometric R geometry -->
    <path d="M 0 32 L 50 0 L 50 25 L 32 36 C 30 37 28 38 24 38 L 24 48 L 50 64 L 50 100 L 32 87 L 24 72 L 24 95 L 0 82 Z" fill="#202020" />
    <!-- Inner counter knockout -->
    <polygon points="12,42 34,28 34,36 12,50" fill="#FFFFFF"/>
    
    <!-- Right Facet: 3 Architectural Louver / Building Slat Panels (Cool Grey #85888C) -->
    <!-- Top slat -->
    <polygon points="56,3 92,24 92,42 56,23" fill="#85888C"/>
    <!-- Middle slat -->
    <polygon points="56,30 92,49 92,67 56,49" fill="#9CA0A5"/>
    <!-- Bottom slat -->
    <polygon points="56,56 92,74 92,92 56,75" fill="#717478"/>
  </g>

  <!-- Vertical Hairline Divider -->
  <line x1="120" y1="12" x2="120" y2="108" stroke="#85888C" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <!-- REALTY (Bold Charcoal) -->
  <text x="138" y="58" font-family="Montserrat, Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="3.5" fill="#202020">REALTY</text>
  
  <!-- EXPERTS (Medium Cool Grey with tracking) -->
  <text x="140" y="99" font-family="Montserrat, Inter, system-ui, -apple-system, sans-serif" font-size="37" font-weight="500" letter-spacing="7" fill="#85888C">EXPERTS</text>
</svg>
